<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640">
<title>JPype at runtime: Python and the JVM in the same OS process</title>
<style>
text{font-family:"Fira Sans","Helvetica Neue",Arial,sans-serif;font-size:18px;fill:#222}
.mono{font-family:"Fira Mono",Menlo,Consolas,monospace;font-size:15px}
.title{font-weight:bold;font-size:20px}
.head{font-weight:bold;font-size:22px;fill:#000080}
.small{font-size:15px;fill:#444}
.proc{fill:#fafafa;stroke:#555;stroke-width:2;stroke-dasharray:10 6}
.py{fill:#d8f1ec;stroke:#2a9d8f;stroke-width:2}
.bridge{fill:#eeeeee;stroke:#777;stroke-width:2}
.jvm{fill:#fff2bf;stroke:#c99a00;stroke-width:2}
.box{fill:#fff;stroke:#777;stroke-width:1.5}
.arrow{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#a)}
.ref{stroke:#c0392b;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#r)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>

<rect class="proc" x="15" y="15" width="1270" height="500" rx="14"/>
<text class="head" x="35" y="48">one OS process: python my_script.py</text>

<!-- Python side -->
<rect class="py" x="35" y="70" width="430" height="425" rx="10"/>
<text class="title" x="55" y="100">Python interpreter (CPython)</text>
<rect class="box" x="55" y="115" width="390" height="80" rx="6"/>
<text class="small" x="70" y="138">your code</text>
<text class="mono" x="70" y="162">l = ArrayList()</text>
<text class="mono" x="70" y="184">l.add("hello")</text>
<rect class="box" x="55" y="210" width="390" height="100" rx="6"/>
<text class="small" x="70" y="233">jpype package (Python side)</text>
<text x="70" y="259">JClass, proxies of Java classes,</text>
<text x="70" y="283">customisers, JConversion, casts</text>
<rect class="box" x="55" y="325" width="390" height="150" rx="6"/>
<text class="small" x="70" y="348">Python heap (Python GC)</text>
<rect class="py" x="80" y="365" width="200" height="50" rx="6"/>
<text class="mono" x="95" y="395">l: proxy object</text>
<text class="small" x="70" y="445">wraps a reference to a Java object,</text>
<text class="small" x="70" y="465">no copy of its data</text>

<!-- bridge -->
<rect class="bridge" x="505" y="70" width="270" height="425" rx="10"/>
<text class="title" x="640" y="100" text-anchor="middle">_jpype native module</text>
<text class="small" x="640" y="122" text-anchor="middle">(C++ extension)</text>
<text x="525" y="170">1. method dispatch:</text>
<text x="545" y="194">overload selection</text>
<text x="525" y="232">2. argument conversion</text>
<text x="545" y="256">(Python → Java)</text>
<text x="525" y="294">3. call through JNI</text>
<text x="525" y="340">4. result conversion</text>
<text x="545" y="364">(primitives, strings)</text>
<text x="545" y="388">or wrapping in a proxy</text>

<!-- JVM side -->
<rect class="jvm" x="815" y="70" width="450" height="425" rx="10"/>
<text class="title" x="835" y="100">JVM (loaded as a shared library)</text>
<rect class="box" x="835" y="115" width="410" height="80" rx="6"/>
<text class="small" x="850" y="138">started once by</text>
<text class="mono" x="850" y="162">jpype.startJVM(</text>
<text class="mono" x="850" y="184">    classpath=["/path/to/my.jar"])</text>
<rect class="box" x="835" y="210" width="410" height="100" rx="6"/>
<text class="small" x="850" y="233">classes from the classpath</text>
<text x="850" y="259">your library (from my.jar),</text>
<text x="850" y="283">java.* (from the JDK)</text>
<rect class="box" x="835" y="325" width="410" height="150" rx="6"/>
<text class="small" x="850" y="348">JVM heap (JVM GC)</text>
<rect class="jvm" x="1010" y="365" width="210" height="50" rx="6"/>
<text class="mono" x="1025" y="395">ArrayList obj</text>

<!-- call flow -->
<line class="arrow" x1="447" y1="162" x2="503" y2="162"/>
<line class="arrow" x1="777" y1="162" x2="833" y2="162"/>
<text class="small" x="475" y="152" text-anchor="middle">call</text>
<line class="arrow" x1="833" y1="390" x2="777" y2="390"/>
<line class="arrow" x1="503" y1="390" x2="447" y2="390"/>
<text class="small" x="805" y="380" text-anchor="middle">return</text>
<path class="ref" d="M280,420 C420,470 860,470 1008,404"/>

<!-- notes -->
<text x="20" y="550">• no inter-process communication, no serialisation: calls go through JNI, in-process</text>
<text x="20" y="582">• the proxy holds a JNI global reference to the Java object (<tspan fill="#c0392b">dashed red</tspan>), which keeps it alive</text>
<text x="20" y="614">• one JVM per process: it starts once, and cannot be restarted after jpype.shutdownJVM()</text>
</svg>
