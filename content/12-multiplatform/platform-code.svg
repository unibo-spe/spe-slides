<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
<title>Lines of code per source set in the running example (csv-core)</title>
<style>
text{font-family:"Fira Sans","Helvetica Neue",Arial,sans-serif;font-size:18px;fill:#222}
.mono{font-family:"Fira Mono",Menlo,Consolas,monospace;font-size:17px}
.head{font-weight:bold;font-size:22px;fill:#000080}
.small{font-size:15px;fill:#444}
.num{font-weight:bold}
.common{fill:#b5d334}
.jvm{fill:#f2c200}
.js{fill:#5b85ff}
.axis{stroke:#999;stroke-width:1}
</style>
<rect width="100%" height="100%" fill="#fff"/>

<!-- scale: 2 px per line -->
<text class="head" x="20" y="36">main code (318 lines)</text>
<text class="mono" x="160" y="81" text-anchor="end">commonMain</text>
<rect class="common" x="175" y="62" width="576" height="26" rx="3"/>
<text class="num" x="761" y="81">288 (91%)</text>
<text class="small" x="871" y="81">15 files: entities, parsing, formatting</text>
<text class="mono" x="160" y="117" text-anchor="end">jvmMain</text>
<rect class="jvm" x="175" y="98" width="34" height="26" rx="3"/>
<text class="num" x="219" y="117">17 (5%)</text>
<text class="small" x="309" y="117">2 files: actual parseCsvFile, FileParser (java.io)</text>
<text class="mono" x="160" y="153" text-anchor="end">jsMain</text>
<rect class="js" x="175" y="134" width="26" height="26" rx="3"/>
<text class="num" x="211" y="153">13 (4%)</text>
<text class="small" x="301" y="153">3 files: actual parseCsvFile, external declarations of Node modules</text>

<text class="head" x="20" y="226">test code (243 lines)</text>
<text class="mono" x="160" y="271" text-anchor="end">commonTest</text>
<rect class="common" x="175" y="252" width="454" height="26" rx="3"/>
<text class="num" x="639" y="271">227 (93%)</text>
<text class="small" x="749" y="271">6 files: all test cases, expect of a test helper</text>
<text class="mono" x="160" y="307" text-anchor="end">jvmTest</text>
<rect class="jvm" x="175" y="288" width="12" height="26" rx="3"/>
<text class="num" x="197" y="307">6 (2%)</text>
<text class="small" x="279" y="307">1 file: actual of the test helper (temp files)</text>
<text class="mono" x="160" y="343" text-anchor="end">jsTest</text>
<rect class="js" x="175" y="324" width="20" height="26" rx="3"/>
<text class="num" x="205" y="343">10 (4%)</text>
<text class="small" x="287" y="343">1 file: actual of the test helper (temp files)</text>

<line class="axis" x1="20" y1="390" x2="1180" y2="390"/>
<text class="small" x="20" y="420">Lines of Kotlin code in csv-core at commit dfd35b4, excluding blank lines, comments, package and import statements.</text>
<text class="small" x="20" y="444">The platform-specific part is the "file ↔ string" I/O: everything else is written once, in common code.</text>
</svg>
