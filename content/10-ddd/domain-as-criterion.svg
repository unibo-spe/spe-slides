<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5332e"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b8a55"/></marker><marker id="a-ora" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0672b"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7f7f"/></marker><marker id="a-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f55a0"/></marker></defs><rect width="1500" height="760" fill="#ffffff"/><text xml:space="preserve" x="320" y="45" font-size="24" fill="#a8871f" text-anchor="middle" font-weight="bold"><tspan x="320" dy="0">What the domain says</tspan></text><text xml:space="preserve" x="320" y="72" font-size="17" fill="#6b6b6b" text-anchor="middle" font-style="italic"><tspan x="320" dy="0">(as told by domain experts)</tspan></text><text xml:space="preserve" x="1170" y="45" font-size="24" fill="#2f6db5" text-anchor="middle" font-weight="bold"><tspan x="1170" dy="0">What it suggests for the design</tspan></text><text xml:space="preserve" x="1170" y="72" font-size="17" fill="#6b6b6b" text-anchor="middle" font-style="italic"><tspan x="1170" dy="0">(and where we discuss it)</tspan></text><rect x="40" y="100" width="560" height="80" rx="10" fill="#fff4c2" stroke="#a8871f" stroke-width="2"/><text xml:space="preserve" x="60" y="146" font-size="19" fill="#2b2b2b" text-anchor="start" font-style="italic"><tspan x="60" dy="0">“A placed order must never change”</tspan></text><path d="M602,140 L878,140" fill="none" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#a-muted)"/><rect x="880" y="100" width="580" height="80" rx="10" fill="#e3edf8" stroke="#2f6db5" stroke-width="2"/><text xml:space="preserve" x="900" y="134" font-size="20" fill="#2f6db5" text-anchor="start" font-weight="bold"><tspan x="900" dy="0">Immutable value objects</tspan></text><text xml:space="preserve" x="1440" y="166" font-size="15" fill="#6b6b6b" text-anchor="end" font-style="italic"><tspan x="1440" dy="0">→ building blocks</tspan></text><rect x="40" y="196" width="560" height="80" rx="10" fill="#fff4c2" stroke="#a8871f" stroke-width="2"/><text xml:space="preserve" x="60" y="231" font-size="19" fill="#2b2b2b" text-anchor="start" font-style="italic"><tspan x="60" dy="0">“Every price change must be traceable,</tspan><tspan x="60" dy="22.8">for years”</tspan></text><path d="M602,236 L878,236" fill="none" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#a-muted)"/><rect x="880" y="196" width="580" height="80" rx="10" fill="#e3edf8" stroke="#2f6db5" stroke-width="2"/><text xml:space="preserve" x="900" y="230" font-size="20" fill="#2f6db5" text-anchor="start" font-weight="bold"><tspan x="900" dy="0">Event sourcing</tspan></text><text xml:space="preserve" x="1440" y="262" font-size="15" fill="#6b6b6b" text-anchor="end" font-style="italic"><tspan x="1440" dy="0">→ event sourcing &amp; CQRS</tspan></text><rect x="40" y="292" width="560" height="80" rx="10" fill="#fff4c2" stroke="#a8871f" stroke-width="2"/><text xml:space="preserve" x="60" y="327" font-size="19" fill="#2b2b2b" text-anchor="start" font-style="italic"><tspan x="60" dy="0">“Payment and shipping are run by different</tspan><tspan x="60" dy="22.8">teams, and change at different paces”</tspan></text><path d="M602,332 L878,332" fill="none" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#a-muted)"/><rect x="880" y="292" width="580" height="80" rx="10" fill="#e3edf8" stroke="#2f6db5" stroke-width="2"/><text xml:space="preserve" x="900" y="326" font-size="20" fill="#2f6db5" text-anchor="start" font-weight="bold"><tspan x="900" dy="0">Separate bounded contexts</tspan></text><text xml:space="preserve" x="1440" y="358" font-size="15" fill="#6b6b6b" text-anchor="end" font-style="italic"><tspan x="1440" dy="0">→ strategic design</tspan></text><rect x="40" y="388" width="560" height="80" rx="10" fill="#fff4c2" stroke="#a8871f" stroke-width="2"/><text xml:space="preserve" x="60" y="423" font-size="19" fill="#2b2b2b" text-anchor="start" font-style="italic"><tspan x="60" dy="0">“The catalogue is browsed all day,</tspan><tspan x="60" dy="22.8">but updated once a week”</tspan></text><path d="M602,428 L878,428" fill="none" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#a-muted)"/><rect x="880" y="388" width="580" height="80" rx="10" fill="#e3edf8" stroke="#2f6db5" stroke-width="2"/><text xml:space="preserve" x="900" y="422" font-size="20" fill="#2f6db5" text-anchor="start" font-weight="bold"><tspan x="900" dy="0">Segregate reads from writes</tspan></text><text xml:space="preserve" x="1440" y="454" font-size="15" fill="#6b6b6b" text-anchor="end" font-style="italic"><tspan x="1440" dy="0">→ event sourcing &amp; CQRS</tspan></text><rect x="40" y="484" width="560" height="80" rx="10" fill="#fff4c2" stroke="#a8871f" stroke-width="2"/><text xml:space="preserve" x="60" y="519" font-size="19" fill="#2b2b2b" text-anchor="start" font-style="italic"><tspan x="60" dy="0">“We may switch payment provider</tspan><tspan x="60" dy="22.8">next year”</tspan></text><path d="M602,524 L878,524" fill="none" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#a-muted)"/><rect x="880" y="484" width="580" height="80" rx="10" fill="#e3edf8" stroke="#2f6db5" stroke-width="2"/><text xml:space="preserve" x="900" y="507" font-size="20" fill="#2f6db5" text-anchor="start" font-weight="bold"><tspan x="900" dy="0">Ports &amp; adapters,</tspan><tspan x="900" dy="23.0">dependency injection</tspan></text><text xml:space="preserve" x="1440" y="550" font-size="15" fill="#6b6b6b" text-anchor="end" font-style="italic"><tspan x="1440" dy="0">→ architecture, building blocks</tspan></text><text xml:space="preserve" x="740" y="312" font-size="18" fill="#6b6b6b" text-anchor="middle" font-style="italic"><tspan x="740" dy="0">suggests</tspan></text><path d="M40,582 L1460,582" stroke="#ccc" stroke-width="1.5"/><text xml:space="preserve" x="40" y="622" font-size="22" fill="#b5332e" text-anchor="start" font-weight="bold"><tspan x="40" dy="0">Not criteria:</tspan></text><rect x="200" y="592" width="310" height="50" rx="25" fill="#fff" stroke="#999" stroke-width="2"/><text xml:space="preserve" x="355" y="624" font-size="18" fill="#6b6b6b" text-anchor="middle" font-style="italic"><tspan x="355" dy="0">“it's trendy”</tspan></text><path d="M212,618 L498,618" stroke="#b5332e" stroke-width="2.5" opacity="0.75"/><rect x="520" y="592" width="310" height="50" rx="25" fill="#fff" stroke="#999" stroke-width="2"/><text xml:space="preserve" x="675" y="624" font-size="18" fill="#6b6b6b" text-anchor="middle" font-style="italic"><tspan x="675" dy="0">“I already know it”</tspan></text><path d="M532,618 L818,618" stroke="#b5332e" stroke-width="2.5" opacity="0.75"/><rect x="840" y="592" width="310" height="50" rx="25" fill="#fff" stroke="#999" stroke-width="2"/><text xml:space="preserve" x="995" y="624" font-size="18" fill="#6b6b6b" text-anchor="middle" font-style="italic"><tspan x="995" dy="0">“the last project used it”</tspan></text><path d="M852,618 L1138,618" stroke="#b5332e" stroke-width="2.5" opacity="0.75"/><rect x="1160" y="592" width="310" height="50" rx="25" fill="#fff" stroke="#999" stroke-width="2"/><text xml:space="preserve" x="1315" y="624" font-size="18" fill="#6b6b6b" text-anchor="middle" font-style="italic"><tspan x="1315" dy="0">“the framework wants it so”</tspan></text><path d="M1172,618 L1458,618" stroke="#b5332e" stroke-width="2.5" opacity="0.75"/><text xml:space="preserve" x="750.0" y="700" font-size="20" fill="#2b2b2b" text-anchor="middle"><tspan x="750.0" dy="0">The same toolbox (languages, patterns, architectures, practices) serves every project:</tspan></text><text xml:space="preserve" x="750.0" y="730" font-size="20" fill="#2b2b2b" text-anchor="middle"><tspan x="750.0" dy="0">the <tspan font-weight="bold" fill="#b5332e">domain</tspan> is what tells which tool fits where</tspan></text></svg>