<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5332e"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b8a55"/></marker><marker id="a-ora" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0672b"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7f7f"/></marker><marker id="a-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f55a0"/></marker></defs><rect width="1400" height="680" fill="#ffffff"/><path d="M30,20 L1320,20 L1370,70 L1370,660 L30,660 Z" fill="#fffdf6" stroke="#999" stroke-width="2"/><path d="M1320,20 L1320,70 L1370,70" fill="#eee" stroke="#999" stroke-width="2"/><text xml:space="preserve" x="60" y="68" font-size="30" fill="#2b2b2b" text-anchor="start" font-weight="bold"><tspan x="60" dy="0">Glossary</tspan></text><text xml:space="preserve" x="200" y="68" font-size="22" fill="#6b6b6b" text-anchor="start" font-style="italic"><tspan x="200" dy="0">— e-commerce domain (excerpt)</tspan></text><rect x="50" y="100" width="1290" height="44" rx="0" fill="#e4e6ea" stroke="#666" stroke-width="1.5"/><text xml:space="preserve" x="60" y="129" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold"><tspan x="60" dy="0">Term</tspan></text><text xml:space="preserve" x="250" y="129" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold"><tspan x="250" dy="0">Context</tspan></text><text xml:space="preserve" x="420" y="129" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold"><tspan x="420" dy="0">Definition</tspan></text><text xml:space="preserve" x="1040" y="129" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold"><tspan x="1040" dy="0">Synonyms / avoid</tspan></text><path d="M50,220 L1340,220" stroke="#ccc" stroke-width="1"/><text xml:space="preserve" x="60" y="187.0" font-size="20" fill="#b5332e" text-anchor="start" font-weight="bold"><tspan x="60" dy="0">Basket</tspan></text><text xml:space="preserve" x="250" y="187.0" font-size="19" fill="#2f6db5" text-anchor="start" font-weight="bold" font-style="italic"><tspan x="250" dy="0">Offer</tspan></text><text xml:space="preserve" x="420" y="176.0" font-size="18" fill="#2b2b2b" text-anchor="start"><tspan x="420" dy="0">The products a customer is considering;</tspan><tspan x="420" dy="21.599999999999998">not binding, prices may still change</tspan></text><text xml:space="preserve" x="1040" y="176.0" font-size="18" fill="#6b6b6b" text-anchor="start" font-style="italic"><tspan x="1040" dy="0">≠ order</tspan><tspan x="1040" dy="21.599999999999998">(avoid: “cart”)</tspan></text><rect x="50" y="220" width="1290" height="76" rx="0" fill="#f6f6f2" stroke="none" stroke-width="0"/><path d="M50,296 L1340,296" stroke="#ccc" stroke-width="1"/><text xml:space="preserve" x="60" y="263.0" font-size="20" fill="#b5332e" text-anchor="start" font-weight="bold"><tspan x="60" dy="0">Order</tspan></text><text xml:space="preserve" x="250" y="263.0" font-size="19" fill="#2f6db5" text-anchor="start" font-weight="bold" font-style="italic"><tspan x="250" dy="0">Offer</tspan></text><text xml:space="preserve" x="420" y="252.0" font-size="18" fill="#2b2b2b" text-anchor="start"><tspan x="420" dy="0">A customer's binding request to buy</tspan><tspan x="420" dy="21.599999999999998">some products at the agreed prices</tspan></text><text xml:space="preserve" x="1040" y="263.0" font-size="18" fill="#6b6b6b" text-anchor="start" font-style="italic"><tspan x="1040" dy="0">avoid: “purchase”</tspan></text><path d="M50,372 L1340,372" stroke="#ccc" stroke-width="1"/><text xml:space="preserve" x="60" y="339.0" font-size="20" fill="#b5332e" text-anchor="start" font-weight="bold"><tspan x="60" dy="0">Place (an order)</tspan></text><text xml:space="preserve" x="250" y="339.0" font-size="19" fill="#2f6db5" text-anchor="start" font-weight="bold" font-style="italic"><tspan x="250" dy="0">Offer</tspan></text><text xml:space="preserve" x="420" y="328.0" font-size="18" fill="#2b2b2b" text-anchor="start"><tspan x="420" dy="0">Turn a basket into an order:</tspan><tspan x="420" dy="21.599999999999998">the customer commits to pay</tspan></text><text xml:space="preserve" x="1040" y="328.0" font-size="18" fill="#6b6b6b" text-anchor="start" font-style="italic"><tspan x="1040" dy="0">avoid: “submit”,</tspan><tspan x="1040" dy="21.599999999999998">“checkout”</tspan></text><rect x="50" y="372" width="1290" height="76" rx="0" fill="#f6f6f2" stroke="none" stroke-width="0"/><path d="M50,448 L1340,448" stroke="#ccc" stroke-width="1"/><text xml:space="preserve" x="60" y="415.0" font-size="20" fill="#b5332e" text-anchor="start" font-weight="bold"><tspan x="60" dy="0">Customer</tspan></text><text xml:space="preserve" x="250" y="415.0" font-size="19" fill="#3b8a55" text-anchor="start" font-weight="bold" font-style="italic"><tspan x="250" dy="0">Payment</tspan></text><text xml:space="preserve" x="420" y="404.0" font-size="18" fill="#2b2b2b" text-anchor="start"><tspan x="420" dy="0">Whoever is billed for an order</tspan><tspan x="420" dy="21.599999999999998">(billing address, VAT number)</tspan></text><text xml:space="preserve" x="1040" y="415.0" font-size="18" fill="#6b6b6b" text-anchor="start" font-style="italic"><tspan x="1040" dy="0">a.k.a. payer</tspan></text><path d="M50,524 L1340,524" stroke="#ccc" stroke-width="1"/><text xml:space="preserve" x="60" y="491.0" font-size="20" fill="#b5332e" text-anchor="start" font-weight="bold"><tspan x="60" dy="0">Customer</tspan></text><text xml:space="preserve" x="250" y="491.0" font-size="19" fill="#c0672b" text-anchor="start" font-weight="bold" font-style="italic"><tspan x="250" dy="0">Shipping</tspan></text><text xml:space="preserve" x="420" y="480.0" font-size="18" fill="#2b2b2b" text-anchor="start"><tspan x="420" dy="0">Whoever receives a shipment</tspan><tspan x="420" dy="21.599999999999998">(shipping address, delivery preferences)</tspan></text><text xml:space="preserve" x="1040" y="491.0" font-size="18" fill="#6b6b6b" text-anchor="start" font-style="italic"><tspan x="1040" dy="0">a.k.a. recipient</tspan></text><rect x="50" y="524" width="1290" height="76" rx="0" fill="#f6f6f2" stroke="none" stroke-width="0"/><path d="M50,600 L1340,600" stroke="#ccc" stroke-width="1"/><text xml:space="preserve" x="60" y="567.0" font-size="20" fill="#b5332e" text-anchor="start" font-weight="bold"><tspan x="60" dy="0">Shipment</tspan></text><text xml:space="preserve" x="250" y="567.0" font-size="19" fill="#c0672b" text-anchor="start" font-weight="bold" font-style="italic"><tspan x="250" dy="0">Shipping</tspan></text><text xml:space="preserve" x="420" y="556.0" font-size="18" fill="#2b2b2b" text-anchor="start"><tspan x="420" dy="0">A parcel carrying (part of) one order</tspan><tspan x="420" dy="21.599999999999998">to one shipping address</tspan></text><text xml:space="preserve" x="1040" y="556.0" font-size="18" fill="#6b6b6b" text-anchor="start" font-style="italic"><tspan x="1040" dy="0">≠ order</tspan><tspan x="1040" dy="21.599999999999998">(avoid: “delivery”)</tspan></text><text xml:space="preserve" x="60" y="640" font-size="17" fill="#6b6b6b" text-anchor="start" font-style="italic"><tspan x="60" dy="0">Same term, different contexts → different meanings (homonyms); different terms, same meaning → pick one (synonyms)</tspan></text></svg>