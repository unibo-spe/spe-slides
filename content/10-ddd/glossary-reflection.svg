<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5332e"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b8a55"/></marker><marker id="a-ora" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0672b"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7f7f"/></marker><marker id="a-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f55a0"/></marker></defs><rect width="1500" height="760" fill="#ffffff"/><rect x="560" y="20" width="380" height="170" rx="6" fill="#fffdf6" stroke="#999" stroke-width="2"/><text xml:space="preserve" x="750.0" y="58" font-size="24" fill="#2b2b2b" text-anchor="middle" font-weight="bold"><tspan x="750.0" dy="0">Glossary</tspan></text><text xml:space="preserve" x="590" y="95" font-size="19" fill="#2b2b2b" text-anchor="start"><tspan x="590" dy="0"><tspan font-weight="bold" fill="#b5332e">Basket</tspan>, <tspan font-weight="bold" fill="#b5332e">Order</tspan>, <tspan font-weight="bold" fill="#b5332e">place</tspan> (an order),</tspan><tspan x="590" dy="23.75"><tspan font-weight="bold" fill="#b5332e">Customer</tspan>, <tspan font-weight="bold" fill="#b5332e">Shipment</tspan>, ...</tspan></text><text xml:space="preserve" x="750.0" y="165" font-size="17" fill="#6b6b6b" text-anchor="middle" font-style="italic"><tspan x="750.0" dy="0">ubiquitous language</tspan></text><path d="M750.0,190 L750.0,245 L250.0,245 L250.0,298" fill="none" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#a-muted)"/><rect x="30" y="300" width="440" height="440" rx="14" fill="#fff" stroke="#2f6db5" stroke-width="3"/><text xml:space="preserve" x="250.0" y="338" font-size="24" fill="#2f6db5" text-anchor="middle" font-weight="bold"><tspan x="250.0" dy="0">Code</tspan></text><path d="M750.0,190 L750.0,245 L750.0,245 L750.0,298" fill="none" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#a-muted)"/><rect x="530" y="300" width="440" height="440" rx="14" fill="#fff" stroke="#3b8a55" stroke-width="3"/><text xml:space="preserve" x="750.0" y="338" font-size="24" fill="#3b8a55" text-anchor="middle" font-weight="bold"><tspan x="750.0" dy="0">Documentation</tspan></text><path d="M750.0,190 L750.0,245 L1250.0,245 L1250.0,298" fill="none" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#a-muted)"/><rect x="1030" y="300" width="440" height="440" rx="14" fill="#fff" stroke="#c0672b" stroke-width="3"/><text xml:space="preserve" x="1250.0" y="338" font-size="24" fill="#c0672b" text-anchor="middle" font-weight="bold"><tspan x="1250.0" dy="0">Conversations</tspan></text><text xml:space="preserve" x="762" y="236" font-size="17" fill="#6b6b6b" text-anchor="start" font-style="italic"><tspan x="762" dy="0">mirrored by</tspan></text><rect x="50" y="360" width="400" height="360" rx="6" fill="#f3f4f6" stroke="#ccc" stroke-width="1"/><text xml:space="preserve" x="70" y="395" font-size="18" fill="#2b2b2b" text-anchor="start" font-family="Menlo, Consolas, monospace"><tspan x="70" dy="0">interface <tspan font-weight="bold" fill="#b5332e">Basket</tspan> {</tspan><tspan x="70" dy="24.3">  CustomerID getCustomer();</tspan><tspan x="70" dy="24.3">  <tspan font-weight="bold" fill="#b5332e">Order</tspan> <tspan font-weight="bold" fill="#b5332e">place</tspan>();</tspan><tspan x="70" dy="24.3">}</tspan><tspan x="70" dy="24.3"> </tspan><tspan x="70" dy="24.3">interface <tspan font-weight="bold" fill="#b5332e">Order</tspan> {</tspan><tspan x="70" dy="24.3">  OrderID getID();</tspan><tspan x="70" dy="24.3">  List&lt;<tspan font-weight="bold" fill="#b5332e">Shipment</tspan>&gt; getShipments();</tspan><tspan x="70" dy="24.3">}</tspan><tspan x="70" dy="24.3"> </tspan><tspan x="70" dy="24.3">interface <tspan font-weight="bold" fill="#b5332e">Customer</tspan> { ... }</tspan></text><rect x="550" y="360" width="400" height="360" rx="6" fill="#fffdf6" stroke="#ccc" stroke-width="1"/><text xml:space="preserve" x="570" y="400" font-size="22" fill="#2b2b2b" text-anchor="start" font-weight="bold"><tspan x="570" dy="0">Placing an order</tspan></text><path d="M570,412 L930,412" stroke="#ccc"/><text xml:space="preserve" x="570" y="445" font-size="18" fill="#2b2b2b" text-anchor="start"><tspan x="570" dy="0">A <tspan font-weight="bold" fill="#b5332e">Customer</tspan> fills a <tspan font-weight="bold" fill="#b5332e">Basket</tspan> with</tspan><tspan x="570" dy="23.400000000000002">products. Prices in a basket may</tspan><tspan x="570" dy="23.400000000000002">still change.</tspan><tspan x="570" dy="23.400000000000002"> </tspan><tspan x="570" dy="23.400000000000002">When the customer <tspan font-weight="bold" fill="#b5332e">places</tspan> the</tspan><tspan x="570" dy="23.400000000000002">basket, it becomes an <tspan font-weight="bold" fill="#b5332e">Order</tspan>: a</tspan><tspan x="570" dy="23.400000000000002">binding request to buy, at the</tspan><tspan x="570" dy="23.400000000000002">agreed prices.</tspan><tspan x="570" dy="23.400000000000002"> </tspan><tspan x="570" dy="23.400000000000002">Each order is delivered via one</tspan><tspan x="570" dy="23.400000000000002">or more <tspan font-weight="bold" fill="#b5332e">Shipments</tspan>.</tspan></text><rect x="1050" y="360" width="400" height="66" rx="14" fill="#fff" stroke="#b5332e" stroke-width="2"/><text xml:space="preserve" x="1064" y="387" font-size="16" fill="#2b2b2b" text-anchor="start"><tspan x="1064" dy="0">“Once the customer <tspan font-weight="bold" fill="#b5332e">places</tspan> the <tspan font-weight="bold" fill="#b5332e">order</tspan>,</tspan><tspan x="1064" dy="20.8">prices can no longer change.”</tspan></text><rect x="1050" y="440" width="400" height="66" rx="14" fill="#fff" stroke="#2f6db5" stroke-width="2"/><text xml:space="preserve" x="1064" y="467" font-size="16" fill="#2b2b2b" text-anchor="start"><tspan x="1064" dy="0">“So <tspan font-weight="bold" fill="#b5332e">place</tspan>() turns the <tspan font-weight="bold" fill="#b5332e">Basket</tspan> into an</tspan><tspan x="1064" dy="20.8"><tspan font-weight="bold" fill="#b5332e">Order</tspan> and freezes its prices?”</tspan></text><rect x="1050" y="520" width="400" height="66" rx="14" fill="#fff" stroke="#3b8a55" stroke-width="2"/><text xml:space="preserve" x="1064" y="547" font-size="16" fill="#2b2b2b" text-anchor="start"><tspan x="1064" dy="0">“How many <tspan font-weight="bold" fill="#b5332e">orders</tspan> are split into</tspan><tspan x="1064" dy="20.8">more than one <tspan font-weight="bold" fill="#b5332e">shipment</tspan>?”</tspan></text><circle cx="1105" cy="620" r="16" fill="#fff" stroke="#b5332e" stroke-width="3"/><path d="M1077,672 Q1077,640 1105,640 Q1133,640 1133,672 Z" fill="#fff" stroke="#b5332e" stroke-width="3"/><text xml:space="preserve" x="1105" y="694" font-size="16" fill="#b5332e" text-anchor="middle" font-weight="bold"><tspan x="1105" dy="0">Domain expert</tspan></text><circle cx="1250" cy="620" r="16" fill="#fff" stroke="#2f6db5" stroke-width="3"/><path d="M1222,672 Q1222,640 1250,640 Q1278,640 1278,672 Z" fill="#fff" stroke="#2f6db5" stroke-width="3"/><text xml:space="preserve" x="1250" y="694" font-size="16" fill="#2f6db5" text-anchor="middle" font-weight="bold"><tspan x="1250" dy="0">Developer</tspan></text><circle cx="1395" cy="620" r="16" fill="#fff" stroke="#3b8a55" stroke-width="3"/><path d="M1367,672 Q1367,640 1395,640 Q1423,640 1423,672 Z" fill="#fff" stroke="#3b8a55" stroke-width="3"/><text xml:space="preserve" x="1395" y="694" font-size="16" fill="#3b8a55" text-anchor="middle" font-weight="bold"><tspan x="1395" dy="0">Manager</tspan></text></svg>