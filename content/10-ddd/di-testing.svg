<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs>
<rect width="1000" height="380" fill="#ffffff"/>
<rect x="290" y="30" width="420" height="70" rx="10" fill="#e3edf8" stroke="#2f6db5" stroke-width="2"/><text x="500" y="62" font-size="17" fill="#2f6db5" font-weight="bold" text-anchor="middle">OrderManagementServiceImpl</text><text x="500" y="86" font-size="14" fill="#6b6b6b" font-style="italic" text-anchor="middle">same production code, OrderStore injected via constructor</text>
<text x="170" y="215" font-size="17" fill="#2b2b2b" font-weight="bold" text-anchor="middle">production</text>
<text x="500" y="215" font-size="17" fill="#2b2b2b" font-weight="bold" text-anchor="middle">unit test</text>
