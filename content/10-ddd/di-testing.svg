<rect x="370" y="230" width="260" height="70" rx="10" fill="#fbe9dc" stroke="#c0672b" stroke-width="2"/><text x="500" y="271" font-size="17" fill="#c0672b" font-weight="bold" text-anchor="middle">mock OrderStore</text>
<rect x="700" y="230" width="260" height="70" rx="10" fill="#e0f1e4" stroke="#3b8a55" stroke-width="2"/><text x="830" y="259" font-size="17" fill="#3b8a55" font-weight="bold" text-anchor="middle">InMemoryOrderStore</text><text x="830" y="284" font-size="15" fill="#3b8a55" text-anchor="middle">or SqlOrderStore on a test DB</text>
<path d="M170,198 L430,102" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-ink)"/>
<path d="M500,198 L500,104" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-ink)"/>
