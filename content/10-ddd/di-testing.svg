<text x="170" y="330" font-size="15" fill="#6b6b6b" font-style="italic" text-anchor="middle">wired by ApplicationFactory</text>
<text x="500" y="330" font-size="15" fill="#6b6b6b" font-style="italic" text-anchor="middle">wired by the test (e.g. Mockito)</text>
<text x="830" y="330" font-size="15" fill="#6b6b6b" font-style="italic" text-anchor="middle">wired by the test (e.g. Testcontainers)</text>
<text x="500" y="368" font-size="16" fill="#6b6b6b" font-style="italic" text-anchor="middle">only the wiring changes: no edits, no static patching</text>
