<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 510" width="1070" height="510" role="img" aria-label="A container adds a thin read-write layer, discarded upon removal, on top of the read-only layers of image my-service, which are shared by all containers of that image"><title>A container adds a thin read-write layer, discarded upon removal, on top of the read-only layers of image my-service, which are shared by all containers of that image</title>
<defs><marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b63"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="arr-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8bfc9"/></marker></defs>
<rect width="1070" height="510" fill="white"/>
<rect x="20" y="20" width="680" height="470" rx="14" fill="white" stroke="#1f3b63" stroke-width="3" stroke-dasharray="10 6" opacity="1"/>
<text x="40" y="44" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">container (e.g. my-container)</text>
<rect x="40" y="70" width="640" height="70" rx="8" fill="#d8f0dc" stroke="#2e7d32" stroke-width="2" opacity="1"/>
<text x="360.0" y="105.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">container layer: files created / changed at run time</text>
<rect x="34" y="160" width="652" height="316" rx="12" fill="#f3f6fb" stroke="#2b6cb0" stroke-width="2" opacity="1"/>
<text x="48" y="180" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#2b6cb0" font-weight="bold">image my-service</text>
<rect x="50" y="200" width="620" height="46" rx="8" fill="#dbe7f5" stroke="#2b6cb0" stroke-width="2" opacity="1"/>
<text x="360.0" y="223.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal"></text>
<text x="66" y="224" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">COPY . .</text>
<rect x="50" y="254" width="620" height="46" rx="8" fill="#dbe7f5" stroke="#2b6cb0" stroke-width="2" opacity="1"/>
<text x="360.0" y="277.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal"></text>
<text x="66" y="278" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">RUN npm install</text>
<rect x="50" y="308" width="620" height="46" rx="8" fill="#dbe7f5" stroke="#2b6cb0" stroke-width="2" opacity="1"/>
<text x="360.0" y="331.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal"></text>
<text x="66" y="332" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">COPY package.json ./</text>
<rect x="50" y="362" width="620" height="46" rx="8" fill="#dbe7f5" stroke="#2b6cb0" stroke-width="2" opacity="1"/>
<text x="360.0" y="385.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal"></text>
<text x="66" y="386" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">RUN apk add --no-cache nodejs npm</text>
<rect x="50" y="416" width="620" height="46" rx="8" fill="#dbe7f5" stroke="#2b6cb0" stroke-width="2" opacity="1"/>
<text x="360.0" y="439.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal"></text>
<text x="66" y="440" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">FROM alpine:latest</text>
<line x1="690" y1="105" x2="790" y2="105" stroke="#2e7d32" stroke-width="3" marker-end="url(#arr-green)"/>
<text x="800" y="105" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="#2e7d32" font-weight="bold">read &amp; write</text>
<line x1="690" y1="318" x2="790" y2="318" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arr-blue)"/>
<text x="800" y="318" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="#2b6cb0" font-weight="bold">read only</text>
<text x="800" y="348" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">(shared by all containers</text>
<text x="800" y="374" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">of the same image)</text>
<text x="800" y="132" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">(discarded when the</text>
<text x="800" y="158" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">container is removed)</text>
</svg>
