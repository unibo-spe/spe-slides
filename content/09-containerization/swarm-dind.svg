<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760" role="img" aria-label="Local Swarm via Docker-in-Docker: on your machine, the local Docker daemon runs five containers attached to one Compose network: master, worker-1, worker-2 and worker-3 are privileged docker:dind containers, each running its own Docker daemon and its own containers (tasks), with the workers joining the Swarm via master:2377; the docker CLI on your machine reaches the Docker API of master via localhost:2375 (DOCKER_HOST), while the browser reaches the services of the Swarm via the gateway container (alpine/socat), which relays ports 9443, 8889 and 8890 to master"><title>Local Swarm via Docker-in-Docker: on your machine, the local Docker daemon runs five containers attached to one Compose network: master, worker-1, worker-2 and worker-3 are privileged docker:dind containers, each running its own Docker daemon and its own containers (tasks), with the workers joining the Swarm via master:2377; the docker CLI on your machine reaches the Docker API of master via localhost:2375 (DOCKER_HOST), while the browser reaches the services of the Swarm via the gateway container (alpine/socat), which relays ports 9443, 8889 and 8890 to master</title>
<defs><marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b63"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00a6a6"/></marker></defs>
