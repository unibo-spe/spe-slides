<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 525" width="1480" height="525" role="img" aria-label="Swarm routing mesh: port 8889 is published on every node; a request to storage1:8889 enters the ingress network, which forwards it to the only wordpress replica, running on inference2"><title>Swarm routing mesh: port 8889 is published on every node; a request to storage1:8889 enters the ingress network, which forwards it to the only wordpress replica, running on inference2</title>
