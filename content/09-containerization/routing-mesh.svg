<text x="105.0" y="155.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">client</text>
<text x="105" y="214" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-weight="normal">curl storage1:8889</text>
