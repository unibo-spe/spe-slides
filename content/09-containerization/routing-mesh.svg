<rect x="660" y="40" width="380" height="420" rx="14" fill="#f3f6fb" stroke="#1f3b63" stroke-width="3" opacity="1"/>
<path d="M660,80 L660,54 Q660,40 674,40 L814,40 L814,62 Q814,80 796,80 Z" fill="#1f3b63"/>
<text x="674" y="61" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="white" font-weight="bold">inference1</text>
