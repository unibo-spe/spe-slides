<text x="1094" y="61" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="white" font-weight="bold">inference2</text>
<rect x="1110" y="130" width="110" height="40" rx="20" fill="#c62828" stroke="#c62828" stroke-width="2" opacity="1"/>
