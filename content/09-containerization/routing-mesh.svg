<rect x="260" y="286" width="1180" height="94" rx="10" fill="#d6f5f5" stroke="#00a6a6" stroke-width="3" opacity="1"/>
<text x="850" y="308" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#006b6b" font-weight="bold">ingress network (overlay, created by Swarm)</text>
<text x="850" y="334" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#006b6b" font-weight="normal" font-style="italic">load-balances requests to the service's replicas, wherever they are</text>
<line x1="192" y1="152" x2="268" y2="152" stroke="#c62828" stroke-width="4" marker-end="url(#arr-red)"/>
<path d="M325,172 L325,354" fill="none" stroke="#c62828" stroke-width="4" marker-end="url(#arr-red)"/>
<path d="M340,364 L1325,364" fill="none" stroke="#c62828" stroke-width="4" marker-end="url(#arr-red)"/>
<path d="M1340,350 L1340,214" fill="none" stroke="#c62828" stroke-width="4" marker-end="url(#arr-red)"/>
<text x="850" y="500" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal" font-style="italic">the published port is open on every node, whether or not it hosts a replica</text>
