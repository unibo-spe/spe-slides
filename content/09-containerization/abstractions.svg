<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="Main abstractions. Encapsulation level: the CLI talks to the engine of a host, which pulls/pushes images (stacks of layers) from/to a registry, runs containers as instances of images (each with its R/W layer), mounts volumes and attaches networks to them. Orchestration level: a cluster of nodes runs stacks, i.e. sets of services, each one consisting of replicated containers placed onto nodes, possibly using secrets"><title>Main abstractions. Encapsulation level: the CLI talks to the engine of a host, which pulls/pushes images (stacks of layers) from/to a registry, runs containers as instances of images (each with its R/W layer), mounts volumes and attaches networks to them. Orchestration level: a cluster of nodes runs stacks, i.e. sets of services, each one consisting of replicated containers placed onto nodes, possibly using secrets</title>
