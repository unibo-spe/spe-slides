<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600" role="img" aria-label="Allocation of the portainer stack onto the DinD Swarm: service agent is global, so one agent container runs on each of master, worker-1, worker-2 and worker-3; service webservice has one replica, constrained to manager nodes, hence it runs on master, together with volume portainer_data and published port 9443; all containers are attached to the overlay network agents_network, through which webservice contacts the agents at tasks.agent:9001"><title>Allocation of the portainer stack onto the DinD Swarm: service agent is global, so one agent container runs on each of master, worker-1, worker-2 and worker-3; service webservice has one replica, constrained to manager nodes, hence it runs on master, together with volume portainer_data and published port 9443; all containers are attached to the overlay network agents_network, through which webservice contacts the agents at tasks.agent:9001</title>
<defs><marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b63"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00a6a6"/></marker></defs>
<rect width="1500" height="600" fill="white"/>
<rect x="450" y="20" width="600" height="60" rx="4" fill="#222222" stroke="#222222" stroke-width="2" opacity="1"/>
<text x="750.0" y="50.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">docker stack deploy -c portainer.yml portainer</text>
<path d="M750,82 L750,124" fill="none" stroke="#1f3b63" stroke-width="3" marker-end="url(#arr-navy)"/>
<rect x="30" y="130" width="330" height="370" rx="14" fill="#f3f6fb" stroke="#1f3b63" stroke-width="3" opacity="1"/>
<path d="M30,170 L30,144 Q30,130 44,130 L170,130 L170,152 Q170,170 152,170 Z" fill="#1f3b63"/>
<text x="44" y="151" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="white" font-weight="bold">master</text>
<rect x="115.0" y="360" width="160" height="44" rx="4" fill="#c62828" stroke="#c62828" stroke-width="2" opacity="1"/>
<text x="195.0" y="382.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">agent</text>
<path d="M195.0,406 L195.0,430" fill="none" stroke="#00a6a6" stroke-width="3" marker-end="url(#arr-teal)"/>
<rect x="400" y="130" width="330" height="370" rx="14" fill="#f3f6fb" stroke="#1f3b63" stroke-width="3" opacity="1"/>
<path d="M400,170 L400,144 Q400,130 414,130 L540,130 L540,152 Q540,170 522,170 Z" fill="#1f3b63"/>
<text x="414" y="151" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="white" font-weight="bold">worker-1</text>
<rect x="485.0" y="360" width="160" height="44" rx="4" fill="#c62828" stroke="#c62828" stroke-width="2" opacity="1"/>
