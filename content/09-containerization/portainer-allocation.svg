<path d="M565.0,406 L565.0,430" fill="none" stroke="#00a6a6" stroke-width="3" marker-end="url(#arr-teal)"/>
<rect x="770" y="130" width="330" height="370" rx="14" fill="#f3f6fb" stroke="#1f3b63" stroke-width="3" opacity="1"/>
<path d="M770,170 L770,144 Q770,130 784,130 L910,130 L910,152 Q910,170 892,170 Z" fill="#1f3b63"/>
<text x="784" y="151" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="white" font-weight="bold">worker-2</text>
<rect x="855.0" y="360" width="160" height="44" rx="4" fill="#c62828" stroke="#c62828" stroke-width="2" opacity="1"/>
<text x="935.0" y="382.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">agent</text>
