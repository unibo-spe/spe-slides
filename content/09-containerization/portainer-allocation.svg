<rect x="1140" y="130" width="330" height="370" rx="14" fill="#f3f6fb" stroke="#1f3b63" stroke-width="3" opacity="1"/>
<path d="M1140,170 L1140,144 Q1140,130 1154,130 L1280,130 L1280,152 Q1280,170 1262,170 Z" fill="#1f3b63"/>
<text x="1154" y="151" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="white" font-weight="bold">worker-3</text>
<rect x="1225.0" y="360" width="160" height="44" rx="4" fill="#c62828" stroke="#c62828" stroke-width="2" opacity="1"/>
<text x="1305.0" y="382.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">agent</text>
<path d="M1305.0,406 L1305.0,430" fill="none" stroke="#00a6a6" stroke-width="3" marker-end="url(#arr-teal)"/>
<text x="344" y="151" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">manager</text>
<rect x="55" y="200" width="160" height="44" rx="4" fill="#1f3b63" stroke="#1f3b63" stroke-width="2" opacity="1"/>
<text x="135.0" y="222.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">webservice</text>
<rect x="240.0" y="204" width="100" height="36" rx="18" fill="#c62828" stroke="#c62828" stroke-width="2" opacity="1"/>
<text x="290" y="222" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">:9443</text>
<path d="M190,246 L190,270 L260,270 L260,286" fill="none" stroke="#f6a623" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-navy)"/>
