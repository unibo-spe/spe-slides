<text x="270" y="326" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">portainer_data</text>
<rect x="20" y="432" width="1460" height="50" rx="10" fill="#d6f5f5" stroke="#00a6a6" stroke-width="3" opacity="1"/>
<text x="750" y="457" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#006b6b" font-weight="bold">agents_network (overlay): webservice → tasks.agent:9001</text>
<path d="M80,246 L80,430" fill="none" stroke="#00a6a6" stroke-width="3" marker-end="url(#arr-teal)"/>
<text x="30" y="530" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal" font-style="italic">agent: mode global, i.e. one replica per node</text>
<text x="1470" y="530" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="end" dominant-baseline="middle" fill="#222222" font-weight="normal" font-style="italic">webservice: 1 replica, node.role == manager, i.e. on master</text>
<text x="30" y="570" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">volume portainer_data is created on the node hosting webservice only</text>
</svg>
