<rect x="780" y="240" width="110" height="40" rx="20" fill="#c62828" stroke="#c62828" stroke-width="2" opacity="1"/>
<text x="835.0" y="260.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">:8888</text>
<line x1="662" y1="260" x2="778" y2="260" stroke="#c62828" stroke-width="3" marker-end="url(#arr-red)" marker-start="url(#arr-red)"/>
<text x="720" y="226" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#c62828" font-weight="bold">-p 8888:8080</text>
<rect x="920" y="160" width="240" height="70" rx="8" fill="white" stroke="#222222" stroke-width="2" opacity="1"/>
<text x="1040.0" y="195.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">browser</text>
<text x="1040" y="260" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-weight="normal">localhost:8888</text>
<line x1="1000" y1="232" x2="892" y2="256" stroke="#222222" stroke-width="2.5" marker-end="url(#arr-gray)"/>
<text x="590" y="660" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">docker run -e SERVICE_PORT=8080 -v /home/$USER/data:/data -p 8888:8080 my-service</text>
</svg>
