<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" width="1180" height="690" role="img" aria-label="Interaction with the outside world: environment variables (-e), volumes (-v) and published ports (-p) are the only channels between container my-service and its host"><title>Interaction with the outside world: environment variables (-e), volumes (-v) and published ports (-p) are the only channels between container my-service and its host</title>
<defs><marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b63"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="arr-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8bfc9"/></marker></defs>
<rect width="1180" height="690" fill="white"/>
<rect x="20" y="20" width="820" height="600" rx="14" fill="#f3f6fb" stroke="#1f3b63" stroke-width="3" opacity="1"/>
<path d="M20,60 L20,34 Q20,20 34,20 L96,20 L96,42 Q96,60 78,60 Z" fill="#1f3b63"/>
<text x="34" y="41" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="white" font-weight="bold">Host</text>
<rect x="260" y="90" width="340" height="260" rx="10" fill="white" stroke="#1f3b63" stroke-width="3" opacity="1"/>
<text x="280" y="114" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">container (my-service)</text>
<text x="430" y="218" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">node index.mjs</text>
<rect x="290" y="140" width="280" height="40" rx="4" fill="#f3e8ff" stroke="#7b3fbf" stroke-width="2" opacity="1"/>
<text x="430.0" y="160.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">SERVICE_PORT=8080</text>
<rect x="370" y="330" width="120" height="40" rx="4" fill="#fff4de" stroke="#f6a623" stroke-width="2" opacity="1"/>
<text x="430.0" y="350.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">/data</text>
<rect x="560" y="240" width="100" height="40" rx="20" fill="white" stroke="#c62828" stroke-width="2" opacity="1"/>
<text x="610.0" y="260.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">:8080</text>
<text x="40" y="146" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16" text-anchor="start" dominant-baseline="middle" fill="#7b3fbf" font-weight="bold">-e SERVICE_PORT=8080</text>
<line x1="60" y1="168" x2="288" y2="168" stroke="#7b3fbf" stroke-width="3" marker-end="url(#arr-navy)"/>
<rect x="260" y="470" width="340" height="100" rx="10" fill="white" stroke="#6b7280" stroke-width="2" opacity="1"/>
<text x="430" y="494" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-weight="bold">host file system (user area)</text>
<text x="430" y="532" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">/home/$USER/data</text>
<line x1="430" y1="372" x2="430" y2="468" stroke="#f6a623" stroke-width="3" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/>
