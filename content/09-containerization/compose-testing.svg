<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 660" width="1360" height="660" role="img" aria-label="Testing with Docker Compose: before all tests, the JUnit class runs docker compose up --wait, which starts MariaDB and waits for its healthcheck; each test then queries the database; after all tests, docker compose down stops and removes it"><title>Testing with Docker Compose: before all tests, the JUnit class runs docker compose up --wait, which starts MariaDB and waits for its healthcheck; each test then queries the database; after all tests, docker compose down stops and removes it</title>
<defs><marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b63"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="arr-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8bfc9"/></marker></defs>
<rect width="1360" height="660" fill="white"/>
<rect x="30" y="20" width="300" height="56" rx="8" fill="#1f3b63" stroke="#1f3b63" stroke-width="2" opacity="1"/>
<text x="180.0" y="48.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">JUnit test class</text>
<line x1="180" y1="78" x2="180" y2="640" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="490" y="20" width="300" height="56" rx="8" fill="#1f3b63" stroke="#1f3b63" stroke-width="2" opacity="1"/>
<text x="640.0" y="48.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">docker compose</text>
<line x1="640" y1="78" x2="640" y2="640" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="950" y="20" width="300" height="56" rx="8" fill="#1f3b63" stroke="#1f3b63" stroke-width="2" opacity="1"/>
<text x="1100.0" y="48.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">MariaDB container</text>
<line x1="1100" y1="78" x2="1100" y2="640" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="180" y1="120" x2="634" y2="120" stroke="#1f3b63" stroke-width="2.5" marker-end="url(#arr-navy)"/>
<text x="410.0" y="106" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1f3b63" font-weight="normal">@BeforeClass: docker compose up --wait</text>
<line x1="640" y1="170" x2="1094" y2="170" stroke="#1f3b63" stroke-width="2.5" marker-end="url(#arr-navy)"/>
<text x="870.0" y="156" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1f3b63" font-weight="normal">create + start</text>
<path d="M1100,206 q60,0 60,14 q0,14 -56,14" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arr-navy)"/>
<text x="1176" y="220" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="start" dominant-baseline="middle" fill="#2e7d32" font-weight="normal" font-style="italic">healthcheck passes</text>
<line x1="640" y1="270" x2="186" y2="270" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr-navy)"/>
<text x="410.0" y="256" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#2e7d32" font-weight="normal">returns: stack is healthy</text>
<line x1="180" y1="340" x2="1094" y2="340" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arr-navy)"/>
<text x="410" y="326" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#2b6cb0" font-weight="normal">@Before: create fresh table (SQL)</text>
<line x1="180" y1="400" x2="1094" y2="400" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arr-navy)"/>
<text x="410" y="386" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#2b6cb0" font-weight="normal">@Test: add / find / remove customers</text>
<line x1="1100" y1="460" x2="186" y2="460" stroke="#2b6cb0" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr-navy)"/>
<text x="870" y="446" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#2b6cb0" font-weight="normal">results</text>
<line x1="180" y1="540" x2="634" y2="540" stroke="#1f3b63" stroke-width="2.5" marker-end="url(#arr-navy)"/>
<text x="410.0" y="526" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1f3b63" font-weight="normal">@AfterClass: docker compose down</text>
<line x1="640" y1="590" x2="1094" y2="590" stroke="#c62828" stroke-width="2.5" marker-end="url(#arr-navy)"/>
<text x="870.0" y="576" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#c62828" font-weight="normal">stop + remove</text>
<rect x="1088" y="180" width="24" height="400" rx="4" fill="#d8f0dc" stroke="#2e7d32" stroke-width="2" opacity="1"/>
</svg>
