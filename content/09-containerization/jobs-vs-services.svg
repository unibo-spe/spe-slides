<line x1="936" y1="258" x2="936" y2="242" stroke="#c62828" stroke-width="2.5" marker-end="url(#arr-red)"/>
<rect x="240" y="340" width="900" height="50" rx="25" fill="#d8f0dc" stroke="#2e7d32" stroke-width="3" opacity="1"/>
<text x="300" y="366" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="start" dominant-baseline="middle" fill="#2e7d32" font-weight="bold">replica 2</text>
<path d="M1140,365 l30,0" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="4 6"/>
<line x1="530" y1="322" x2="530" y2="338" stroke="#222222" stroke-width="2.5" marker-end="url(#arr-navy)"/>
<line x1="556" y1="338" x2="556" y2="322" stroke="#c62828" stroke-width="2.5" marker-end="url(#arr-red)"/>
<line x1="750" y1="322" x2="750" y2="338" stroke="#222222" stroke-width="2.5" marker-end="url(#arr-navy)"/>
<line x1="776" y1="338" x2="776" y2="322" stroke="#c62828" stroke-width="2.5" marker-end="url(#arr-red)"/>
<line x1="970" y1="322" x2="970" y2="338" stroke="#222222" stroke-width="2.5" marker-end="url(#arr-navy)"/>
<line x1="996" y1="338" x2="996" y2="322" stroke="#c62828" stroke-width="2.5" marker-end="url(#arr-red)"/>
<rect x="20" y="290" width="170" height="60" rx="8" fill="white" stroke="#222222" stroke-width="2" opacity="1"/>
<text x="105.0" y="320.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">clients</text>
<text x="240" y="420" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">start</text>
<text x="1140" y="420" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">runs until explicitly stopped</text>
<text x="700" y="448" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">↓ request   ↑ response</text>
</svg>
