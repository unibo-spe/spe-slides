<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Jobs vs. services: a job reads its input, computes, writes its output, and terminates by itself; a service runs indefinitely, possibly replicated, serving requests from clients"><title>Jobs vs. services: a job reads its input, computes, writes its output, and terminates by itself; a service runs indefinitely, possibly replicated, serving requests from clients</title>
<defs><marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b63"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="arr-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8bfc9"/></marker></defs>
<rect width="1200" height="470" fill="white"/>
<text x="20" y="40" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">job (short-lived)</text>
<path d="M20,70 h122 l28,28 v42 h-150 z" fill="white" stroke="#6b7280" stroke-width="2.5"/><path d="M142,70 v28 h28" fill="none" stroke="#6b7280" stroke-width="2.5"/>
<text x="95.0" y="105.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="bold">input</text>
<line x1="172" y1="105" x2="238" y2="105" stroke="#6b7280" stroke-width="3" marker-end="url(#arr-gray)"/>
<rect x="240" y="80" width="520" height="50" rx="25" fill="#dbe7f5" stroke="#2b6cb0" stroke-width="3" opacity="1"/>
<text x="500" y="106" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#2b6cb0" font-weight="bold">running: computing</text>
<line x1="762" y1="105" x2="828" y2="105" stroke="#6b7280" stroke-width="3" marker-end="url(#arr-gray)"/>
<path d="M830,70 h122 l28,28 v42 h-150 z" fill="white" stroke="#6b7280" stroke-width="2.5"/><path d="M952,70 v28 h28" fill="none" stroke="#6b7280" stroke-width="2.5"/>
<text x="905.0" y="105.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="bold">output</text>
<text x="240" y="160" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">start</text>
<text x="760" y="160" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">terminates by itself</text>
<text x="20" y="230" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">service (long-lived)</text>
