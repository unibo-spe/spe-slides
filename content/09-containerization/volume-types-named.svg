<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 525" width="1080" height="525" role="img" aria-label="Named volume: a Docker-managed volume, stored in /var/lib/docker/volumes/VOLUME_NAME/_data is mounted on /data inside the container"><title>Named volume: a Docker-managed volume, stored in /var/lib/docker/volumes/VOLUME_NAME/_data is mounted on /data inside the container</title>
<defs><marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b63"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="arr-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8bfc9"/></marker></defs>
<rect width="1080" height="525" fill="white"/>
<rect x="10" y="10" width="1060" height="460" rx="14" fill="#f3f6fb" stroke="#1f3b63" stroke-width="3" opacity="1"/>
<path d="M10,50 L10,24 Q10,10 24,10 L86,10 L86,32 Q86,50 68,50 Z" fill="#1f3b63"/>
<text x="24" y="31" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="white" font-weight="bold">Host</text>
<rect x="400" y="40" width="260" height="70" rx="8" fill="white" stroke="#1f3b63" stroke-width="2" opacity="1"/>
<text x="530.0" y="75.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">container</text>
<text x="530" y="128" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1f3b63" font-weight="normal">/data</text>
<rect x="40" y="290" width="740" height="160" rx="10" fill="white" stroke="#6b7280" stroke-width="2" opacity="1"/>
<text x="60" y="430" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="bold">host file system</text>
<rect x="60" y="312" width="280" height="92" rx="6" fill="white" stroke="#6b7280" stroke-width="2" opacity="1"/>
<text x="200" y="334" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-weight="bold">user area</text>
<text x="200" y="370" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">/home/$USER/path/to/file</text>
<rect x="356" y="312" width="408" height="92" rx="6" fill="#fff4de" stroke="#f6a623" stroke-width="2" stroke-dasharray="7 5" opacity="1"/>
<text x="560" y="334" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#9a6200" font-weight="bold">Docker daemon area</text>
<text x="560" y="370" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">/var/lib/docker/volumes/VOLUME_NAME/_data</text>
<rect x="820" y="330" width="220" height="80" rx="8" fill="white" stroke="#6b7280" stroke-width="2" opacity="1"/>
<text x="930.0" y="370.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-weight="bold">memory</text>
<path d="M400,80 C220,80 180,200 200,306" fill="none" stroke="#b8bfc9" stroke-width="3" marker-end="url(#arr-fade)"/>
<text x="100" y="190" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#b8bfc9" font-weight="normal">bind</text>
<text x="100" y="218" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#b8bfc9" font-weight="normal">mount</text>
<path d="M530,140 C530,220 560,260 560,306" fill="none" stroke="#c62828" stroke-width="5" marker-end="url(#arr-red)"/>
<text x="650" y="226" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#c62828" font-weight="bold">named</text>
<text x="650" y="254" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#c62828" font-weight="bold">volume</text>
<path d="M660,80 C860,80 930,200 930,324" fill="none" stroke="#b8bfc9" stroke-width="3" marker-end="url(#arr-fade)"/>
<text x="1000" y="190" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#b8bfc9" font-weight="normal">tmpfs</text>
<text x="1000" y="218" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#b8bfc9" font-weight="normal">mount</text>
<text x="540" y="500" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#c62828" font-weight="bold">-v VOLUME_NAME:/data</text>
</svg>
