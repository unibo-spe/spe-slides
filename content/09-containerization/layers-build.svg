<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 560" width="1520" height="560" role="img" aria-label="docker build turns each filesystem-changing Dockerfile instruction (FROM, RUN, COPY) into a read-only layer of image my-service, stacked on top of the previous one, while WORKDIR, ENV, EXPOSE and CMD only set the image configuration"><title>docker build turns each filesystem-changing Dockerfile instruction (FROM, RUN, COPY) into a read-only layer of image my-service, stacked on top of the previous one, while WORKDIR, ENV, EXPOSE and CMD only set the image configuration</title>
<defs><marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b63"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="arr-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8bfc9"/></marker></defs>
<rect width="1520" height="560" fill="white"/>
<rect x="20" y="20" width="560" height="510" rx="10" fill="white" stroke="#6b7280" stroke-width="2" opacity="1"/>
<text x="36" y="44" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">Dockerfile</text>
<circle cx="50" cy="84" r="15" fill="#2b6cb0"/><text x="50" y="85" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">1</text>
<text x="76" y="85" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">FROM alpine:latest</text>
<circle cx="50" cy="134" r="15" fill="#2b6cb0"/><text x="50" y="135" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">2</text>
<text x="76" y="135" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">RUN apk add --no-cache nodejs npm</text>
<circle cx="50" cy="184" r="15" fill="#6b7280"/><text x="50" y="185" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">3</text>
<text x="76" y="185" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">WORKDIR /my-project</text>
<circle cx="50" cy="234" r="15" fill="#2b6cb0"/><text x="50" y="235" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">4</text>
<text x="76" y="235" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">COPY package.json ./</text>
<circle cx="50" cy="284" r="15" fill="#2b6cb0"/><text x="50" y="285" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">5</text>
<text x="76" y="285" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">RUN npm install</text>
<circle cx="50" cy="334" r="15" fill="#2b6cb0"/><text x="50" y="335" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">6</text>
<text x="76" y="335" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">COPY . .</text>
<circle cx="50" cy="384" r="15" fill="#6b7280"/><text x="50" y="385" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">7</text>
<text x="76" y="385" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">ENV SERVICE_PORT=8080</text>
<circle cx="50" cy="434" r="15" fill="#6b7280"/><text x="50" y="435" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">8</text>
<text x="76" y="435" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">EXPOSE 8080</text>
<circle cx="50" cy="484" r="15" fill="#6b7280"/><text x="50" y="485" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">9</text>
<text x="76" y="485" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">CMD ["npm", "run", "service"]</text>
<line x1="610" y1="290" x2="830" y2="290" stroke="#1f3b63" stroke-width="4" marker-end="url(#arr-navy)"/>
<text x="720" y="262" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#1f3b63" font-weight="normal">docker build</text>
<text x="720" y="320" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1f3b63" font-weight="normal">-t my-service .</text>
<rect x="840" y="20" width="660" height="520" rx="14" fill="#f3f6fb" stroke="#1f3b63" stroke-width="3" opacity="1"/>
<text x="860" y="44" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="22" text-anchor="start" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">image my-service</text>
<rect x="860" y="62" width="620" height="104" rx="8" fill="white" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6" opacity="1"/>
<text x="1170.0" y="114.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal"></text>
<text x="876" y="82" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">configuration (metadata, no layer)</text>
<circle cx="890" cy="114" r="15" fill="#6b7280"/><text x="890" y="115" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">3</text>
<text x="914" y="115" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="18" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">WORKDIR /my-project</text>
<circle cx="1190" cy="114" r="15" fill="#6b7280"/><text x="1190" y="115" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">7</text>
<text x="1214" y="115" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="18" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">ENV SERVICE_PORT=8080</text>
<circle cx="890" cy="148" r="15" fill="#6b7280"/><text x="890" y="149" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">8</text>
<text x="914" y="149" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="18" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">EXPOSE 8080</text>
<circle cx="1190" cy="148" r="15" fill="#6b7280"/><text x="1190" y="149" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">9</text>
<text x="1214" y="149" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="18" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">CMD ["npm", ...]</text>
<rect x="860" y="470" width="620" height="54" rx="8" fill="#dbe7f5" stroke="#2b6cb0" stroke-width="2" opacity="1"/>
<text x="1170.0" y="497.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal"></text>
<circle cx="890" cy="497" r="15" fill="#2b6cb0"/><text x="890" y="498" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">1</text>
<text x="916" y="498" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">FROM alpine:latest</text>
<text x="1466" y="498" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">base layer</text>
<rect x="860" y="406" width="620" height="54" rx="8" fill="#dbe7f5" stroke="#2b6cb0" stroke-width="2" opacity="1"/>
<text x="1170.0" y="433.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal"></text>
<circle cx="890" cy="433" r="15" fill="#2b6cb0"/><text x="890" y="434" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">2</text>
<text x="916" y="434" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">RUN apk add --no-cache nodejs npm</text>
<text x="1466" y="434" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">layer 1</text>
<rect x="860" y="342" width="620" height="54" rx="8" fill="#dbe7f5" stroke="#2b6cb0" stroke-width="2" opacity="1"/>
<text x="1170.0" y="369.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal"></text>
<circle cx="890" cy="369" r="15" fill="#2b6cb0"/><text x="890" y="370" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">4</text>
<text x="916" y="370" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">COPY package.json ./</text>
<text x="1466" y="370" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">layer 2</text>
<rect x="860" y="278" width="620" height="54" rx="8" fill="#dbe7f5" stroke="#2b6cb0" stroke-width="2" opacity="1"/>
<text x="1170.0" y="305.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal"></text>
<circle cx="890" cy="305" r="15" fill="#2b6cb0"/><text x="890" y="306" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">5</text>
<text x="916" y="306" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">RUN npm install</text>
<text x="1466" y="306" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">layer 3</text>
<rect x="860" y="214" width="620" height="54" rx="8" fill="#dbe7f5" stroke="#2b6cb0" stroke-width="2" opacity="1"/>
<text x="1170.0" y="241.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal"></text>
<circle cx="890" cy="241" r="15" fill="#2b6cb0"/><text x="890" y="242" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">6</text>
<text x="916" y="242" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#222222" font-weight="normal">COPY . .</text>
<text x="1466" y="242" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">layer 4</text>
<text x="1170.0" y="192" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#2b6cb0" font-weight="normal" font-style="italic">filesystem layers (read-only diffs)</text>
