<text x="1495.0" y="206.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">:8888</text>
<line x1="1364" y1="206" x2="1441" y2="206" stroke="#c62828" stroke-width="3" marker-end="url(#arr-red)" marker-start="url(#arr-red)"/>
<text x="1305" y="290" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#2e7d32" font-weight="normal" font-style="italic">chosen host port</text>
<text x="1305" y="382" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">docker run -p 8888:8080 my-service</text>
