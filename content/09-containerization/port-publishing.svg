<text x="685" y="116" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">my-service</text>
<text x="685" y="150" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-weight="normal">EXPOSE 8080</text>
