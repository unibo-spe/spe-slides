<text x="975.0" y="206.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">:32773</text>
<line x1="844" y1="206" x2="921" y2="206" stroke="#c62828" stroke-width="3" marker-end="url(#arr-red)" marker-start="url(#arr-red)"/>
<text x="785" y="290" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#2e7d32" font-weight="normal" font-style="italic">random host port</text>
