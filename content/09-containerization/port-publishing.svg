<path d="M419,195 L441,217 M441,195 L419,217" fill="none" stroke="#c62828" stroke-width="5"/>
<text x="265" y="290" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#c62828" font-weight="normal" font-style="italic">EXPOSE 8080 only: not reachable</text>
