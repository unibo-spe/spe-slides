<rect x="335" y="510" width="230" height="44" rx="4" fill="#3fa9f5" stroke="#3fa9f5" stroke-width="2" opacity="1"/>
<text x="450.0" y="532.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">eth0: 192.168.1.2</text>
