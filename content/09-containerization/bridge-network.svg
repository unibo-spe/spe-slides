<circle cx="450" cy="450" r="30" fill="#1f3b63"/><text x="450" y="451" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">NAT</text>
