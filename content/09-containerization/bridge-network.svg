<text x="580" y="452" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">outbound traffic only,</text>
<text x="580" y="476" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">unless ports are published (-p)</text>
<line x1="450" y1="554" x2="450" y2="618" stroke="#6b7280" stroke-width="3"/>
<rect x="40" y="620" width="820" height="56" rx="8" fill="#1f3b63" stroke="#1f3b63" stroke-width="2" opacity="1"/>
<text x="450.0" y="648.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">external network (LAN / Internet)</text>
