<text x="255" y="62" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-weight="normal">--hostname docker</text>
<rect x="330" y="320" width="240" height="60" rx="8" fill="#1f3b63" stroke="#1f3b63" stroke-width="2" opacity="1"/>
<text x="450.0" y="350.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">my-network</text>
