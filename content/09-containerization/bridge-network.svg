<text x="235.0" y="212.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">eth0: 172.18.0.2</text>
<rect x="500" y="80" width="330" height="170" rx="10" fill="white" stroke="#1f3b63" stroke-width="3" opacity="1"/>
<text x="518" y="104" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">container cli</text>
<text x="665" y="146" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">docker CLI</text>
