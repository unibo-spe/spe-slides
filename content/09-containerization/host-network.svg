<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620" role="img" aria-label="Host network driver: container my-service uses the host's network stack directly, so it listens on port 8080 of the host's own IP address"><title>Host network driver: container my-service uses the host's network stack directly, so it listens on port 8080 of the host's own IP address</title>
<defs><marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b63"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="arr-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8bfc9"/></marker></defs>
<rect width="700" height="620" fill="white"/>
<rect x="20" y="20" width="660" height="440" rx="14" fill="#f3f6fb" stroke="#1f3b63" stroke-width="3" opacity="1"/>
<path d="M20,60 L20,34 Q20,20 34,20 L96,20 L96,42 Q96,60 78,60 Z" fill="#1f3b63"/>
<text x="34" y="41" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="white" font-weight="bold">Host</text>
<rect x="170" y="90" width="360" height="160" rx="10" fill="white" stroke="#1f3b63" stroke-width="3" stroke-dasharray="10 6" opacity="1"/>
<text x="190" y="114" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" text-anchor="start" dominant-baseline="middle" fill="#1f3b63" font-weight="bold">container (my-service)</text>
<text x="350" y="170" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">node index.mjs</text>
<text x="350" y="206" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">listening on :8080</text>
<line x1="350" y1="250" x2="350" y2="356" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arr-blue)"/>
<text x="362" y="300" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">no own network stack</text>
<rect x="220" y="360" width="260" height="44" rx="4" fill="#3fa9f5" stroke="#3fa9f5" stroke-width="2" opacity="1"/>
<text x="350.0" y="382.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">eth0: 192.168.1.2</text>
<rect x="490" y="360" width="110" height="44" rx="22" fill="#c62828" stroke="#c62828" stroke-width="2" opacity="1"/>
<text x="545.0" y="382.0" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">:8080</text>
<text x="545" y="428" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#c62828" font-weight="normal" font-style="italic">busy for the host too</text>
<line x1="350" y1="404" x2="350" y2="498" stroke="#6b7280" stroke-width="3"/>
<rect x="40" y="500" width="620" height="56" rx="8" fill="#1f3b63" stroke="#1f3b63" stroke-width="2" opacity="1"/>
<text x="350.0" y="528.0" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="normal">external network (LAN / Internet)</text>
<text x="350" y="590" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#c62828" font-weight="bold">docker run --network host my-service</text>
</svg>
