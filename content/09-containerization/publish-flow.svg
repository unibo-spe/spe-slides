<path d="M20,80 L20,54 Q20,40 34,40 L200,40 L200,62 Q200,80 182,80 Z" fill="#1f3b63"/>
<text x="34" y="61" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="start" dominant-baseline="middle" fill="white" font-weight="bold">your machine</text>
<path d="M50,100 h142 l28,28 v42 h-170 z" fill="white" stroke="#6b7280" stroke-width="2.5"/><path d="M192,100 v28 h28" fill="none" stroke="#6b7280" stroke-width="2.5"/>
