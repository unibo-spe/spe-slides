<text x="1270" y="145" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">&lt;username&gt;/my-image:0.1.0</text>
