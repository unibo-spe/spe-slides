<text x="985.0" y="54" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#222222" font-weight="normal">db-credentials</text>
<text x="985.0" y="82" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">secret</text>
<path d="M985.0,100 L680,308" fill="none" stroke="#f6a623" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr-gray)"/>
<path d="M985.0,100 L1040,308" fill="none" stroke="#f6a623" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr-gray)"/>
<text x="1200" y="54" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">configs / secrets: read-only files</text>
<text x="1200" y="78" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="start" dominant-baseline="middle" fill="#6b7280" font-weight="normal" font-style="italic">secrets in /run/secrets/&lt;name&gt;</text>
