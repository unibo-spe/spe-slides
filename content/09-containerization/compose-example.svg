<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 610" width="1560" height="610" role="img" aria-label="Example Compose stack: the user reaches service frontend (image example/webapp) on host port 443; frontend is attached to networks front-tier and back-tier, backend (image example/database) only to back-tier and mounts volume db-data; config httpd-config and secret server-certificate are injected into frontend, secret db-credentials into both services"><title>Example Compose stack: the user reaches service frontend (image example/webapp) on host port 443; frontend is attached to networks front-tier and back-tier, backend (image example/database) only to back-tier and mounts volume db-data; config httpd-config and secret server-certificate are injected into frontend, secret db-credentials into both services</title>
<defs><marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3b63"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="arr-fade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8bfc9"/></marker></defs>
<rect width="1560" height="610" fill="white"/>
<rect x="260" y="140" width="1120" height="420" rx="16" fill="white" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6" opacity="1"/>
<text x="1360" y="165" font-family="'Fira Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-weight="bold">stack</text>
<rect x="300" y="230" width="460" height="280" rx="14" fill="#e7f0fb" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="8 5" opacity="1"/>
<text x="318" y="252" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#2b6cb0" font-weight="bold">front-tier</text>
